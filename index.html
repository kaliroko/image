<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="color-scheme" content="dark">
    <title>安全检查</title>
    <style>
        :root {
            --background: hsl(240 10% 3.9%);
            --foreground: hsl(0 0% 98%);
            --card: hsl(240 6% 6.5%);
            --muted-foreground: hsl(240 5% 64.9%);
            --subtle-foreground: hsl(240 4% 46%);
            --border: hsl(240 3.7% 15.9%);
            --border-strong: hsl(240 4% 22%);
            --primary: hsl(0 0% 98%);
            --primary-foreground: hsl(240 5.9% 10%);
            --ring: hsl(240 4.9% 83.9%);
            --radius: 0.5rem;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
        }
        *,
        *::before,
        *::after { box-sizing: border-box; }
        body {
            margin: 0;
            background-color: var(--background);
            color: var(--foreground);
            font-family: var(--font-sans);
            -webkit-font-smoothing: antialiased;
        }
        .overlay,
        .jumpscare { position: fixed; top: 0; left: 0; height: 100%; width: 100%; }
        .overlay {
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            overflow: hidden;
            background-color: var(--background);
        }
        .overlay[hidden] { display: none; }
        .jumpscare { z-index: 1; }
        .pulse-wrapper { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 0; pointer-events: none; }
        .circle { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); border-radius: 50%; border: 1px solid hsl(240 3.7% 15.9% / 0.9); animation: ripple 5s infinite ease-out; }
        .circle:nth-child(2) { animation-delay: 1.25s; }
        .circle:nth-child(3) { animation-delay: 2.5s; }
        .circle:nth-child(4) { animation-delay: 3.75s; }
        @keyframes ripple { 0% { width: 0; height: 0; opacity: 1; } 100% { width: 640px; height: 640px; opacity: 0; } }
        .card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 25rem;
            background-color: var(--card);
            border: 1px solid var(--border);
            border-radius: calc(var(--radius) + 0.25rem);
            box-shadow: 0 1px 2px hsl(0 0% 0% / 0.3), 0 8px 32px hsl(0 0% 0% / 0.45);
        }
        .card-header { padding: 1.5rem 1.5rem 1.25rem; }
        .card-title { margin: 0; font-size: 1rem; font-weight: 600; letter-spacing: -0.01em; line-height: 1.4; }
        .card-description { margin: 0.375rem 0 0; font-size: 0.875rem; line-height: 1.55; color: var(--muted-foreground); }
        .card-content { padding: 0 1.5rem 1.5rem; }
        .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: 0.875rem 1.5rem;
            border-top: 1px solid var(--border);
            font-size: 0.75rem;
            color: var(--subtle-foreground);
        }
        .ray-id code { font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted-foreground); }
        .footer-links { display: inline-flex; gap: 0.875rem; white-space: nowrap; }
        .footer-link { color: var(--subtle-foreground); text-decoration: none; border-radius: calc(var(--radius) - 0.25rem); transition: color 0.15s ease; }
        .footer-link:hover { color: var(--foreground); }
        .check-row {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            width: 100%;
            margin: 0;
            padding: 0.875rem 1rem;
            background-color: hsl(240 5% 9%);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: inherit;
            font: inherit;
            text-align: left;
            cursor: pointer;
            transition: border-color 0.15s ease, background-color 0.15s ease;
        }
        .check-row:hover:not(:disabled) { background-color: hsl(240 5% 11%); border-color: var(--border-strong); }
        .check-row:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
        .check-row:disabled { cursor: default; }
        .check-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            flex: none;
            height: 1.125rem;
            width: 1.125rem;
            border: 1px solid var(--border-strong);
            border-radius: calc(var(--radius) - 0.25rem);
            transition: background-color 0.15s ease, border-color 0.15s ease;
        }
        .check-row[data-state="verifying"] .check-indicator { background-color: var(--primary); border-color: var(--primary); }
        .check-mark { height: 0.875rem; width: 0.875rem; color: var(--primary-foreground); opacity: 0; transition: opacity 0.15s ease; }
        .check-row[data-state="verifying"] .check-mark { opacity: 1; }
        .check-label { font-size: 0.875rem; line-height: 1.4; color: var(--foreground); }
        .check-spinner {
            flex: none;
            margin-left: auto;
            height: 0.875rem;
            width: 0.875rem;
            border: 2px solid var(--border-strong);
            border-top-color: var(--muted-foreground);
            border-radius: 50%;
            opacity: 0;
        }
        .check-row[data-state="verifying"] .check-spinner { opacity: 1; animation: spin 0.7s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .progress {
            height: 0.25rem;
            width: 100%;
            margin-top: 0.75rem;
            background-color: var(--border);
            border-radius: 9999px;
            overflow: hidden;
        }
        .progress[hidden] { display: none; }
        .progress-bar { height: 100%; width: 0; background-color: var(--primary); border-radius: inherit; transition: width 0.12s linear; }
        video#video { height: 100%; width: 100%; object-fit: cover; }
        video#video::-webkit-media-controls-enclosure { display: none !important; }
        /* 检查步骤列表 */
        .check-steps {
            margin-top: 0.75rem;
            font-size: 0.75rem;
            color: var(--muted-foreground);
            text-align: left;
        }
        .check-steps p {
            margin: 0.25rem 0;
            opacity: 0.3;
            transition: opacity 0.2s;
        }
        .check-steps p.active {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="overlay" class="overlay">
        <div class="pulse-wrapper" aria-hidden="true">
            <div class="circle"></div>
            <div class="circle"></div>
            <div class="circle"></div>
            <div class="circle"></div>
        </div>
        <main class="card">
            <div class="card-header">
                <h1 class="card-title">安全检查</h1>
                <p class="card-description">请确认为非自动化客户端以继续。</p>
            </div>
            <div class="card-content">
                <button id="verify" class="check-row" type="button" data-state="idle">
                    <span class="check-indicator" aria-hidden="true">
                        <svg class="check-mark" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3.5 8.5 6.5 11.5 12.5 4.5" />
                        </svg>
                    </span>
                    <span class="check-label" id="check-label">验证您是人类</span>
                    <span class="check-spinner" aria-hidden="true"></span>
                </button>
                <div id="progress" class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="验证进度" hidden>
                    <div id="progress-bar" class="progress-bar"></div>
                </div>
                <div id="check-steps" class="check-steps"></div>
            </div>
            <div class="card-footer">
                <span class="ray-id">Ray ID: <code id="ray-id">&mdash;</code></span>
                <span class="footer-links">
                    <a href="#" class="footer-link">隐私</a>
                    <a href="#" class="footer-link">条款</a>
                </span>
            </div>
        </main>
    </div>
    <div class="jumpscare">
        <video id="video" src="assets/video/video.mp4" preload="auto" loop></video>
    </div>

    <!-- 主验证脚本 -->
    <script data-cfasync="false">
        const overlay = document.getElementById("overlay");
        const video = document.getElementById("video");
        const verifyButton = document.getElementById("verify");
        const checkLabel = document.getElementById("check-label");
        const progress = document.getElementById("progress");
        const progressBar = document.getElementById("progress-bar");
        const rayId = document.getElementById("ray-id");
        const footerLinks = document.querySelectorAll(".footer-link");
        const checkStepsContainer = document.getElementById("check-steps");

        const REVEAL_AT_PERCENT = 80;
        const VERIFY_DURATION_MS = 10000; // 前10条共10秒
        const MIN_TICK_MS = 70;
        const MAX_TICK_MS = 360;
        const MAX_LAG_PERCENT = 14;
        const INITIAL_PERCENT_MIN = 3;
        const INITIAL_PERCENT_MAX = 9;

        // 20条检查步骤
        const CHECK_STEPS = [
            "正在验证浏览器指纹...",
            "正在检测网络环境...",
            "正在检查 DNS 配置...",
            "正在扫描 WebRTC 泄露...",
            "正在验证 Canvas 指纹...",
            "正在检测 AudioContext 指纹...",
            "正在检查 WebGL 信息...",
            "正在验证字体列表...",
            "正在分析浏览器插件...",
            "正在检测屏幕分辨率...",
            "正在检查时区与语言...",
            "正在验证本地存储...",
            "正在分析 Cookie 状态...",
            "正在检测硬件并发数...",
            "正在检查平台与系统...",
            "正在验证设备内存...",
            "正在检测触摸屏支持...",
            "正在分析音频指纹...",
            "正在验证 Web 功能...",
            "正在检查连接速度..."
        ];

        let armed = false;
        let percent = 0;
        let stepTimer;

        function generateRayId() {
            const bytes = new Uint8Array(8);
            crypto.getRandomValues(bytes);
            return Array.from(bytes, (byte) => byte.toString(16).padStart(2, "0")).join("");
        }

        function setPercent(value) {
            percent = value;
            progressBar.style.width = value + "%";
            progress.setAttribute("aria-valuenow", Math.round(value));
        }

        function enterFullScreen() {
            const element = document.documentElement;
            const request = element.requestFullscreen || element.mozRequestFullScreen || element.webkitRequestFullscreen || element.msRequestFullscreen;
            if (!request) return;
            Promise.resolve(request.call(element)).catch(() => {});
        }

        function reveal() {
            setPercent(REVEAL_AT_PERCENT);
            enterFullScreen();
            video.volume = 1.0;      // 音量最大100%
            video.muted = false;     // 取消静音
            overlay.hidden = true;
            video.play().catch(() => {});
            clearInterval(stepTimer);
        }

        // 确保每次视频播放时音量都是100%
        video.addEventListener('play', () => {
            video.volume = 1.0;
            video.muted = false;
        });

        function tick(startedAt) {
            const elapsed = performance.now() - startedAt;
            if (elapsed >= VERIFY_DURATION_MS) {
                reveal();
                return;
            }
            const paced = (elapsed / VERIFY_DURATION_MS) * REVEAL_AT_PERCENT;
            const lagged = paced - Math.random() * MAX_LAG_PERCENT;
            setPercent(Math.max(percent, Math.min(lagged, REVEAL_AT_PERCENT)));
            window.setTimeout(() => tick(startedAt), MIN_TICK_MS + Math.random() * (MAX_TICK_MS - MIN_TICK_MS));
        }

        function startCheckSteps() {
            checkStepsContainer.innerHTML = '';
            // 创建全部20条步骤，但只高亮前10条
            for (let i = 0; i < CHECK_STEPS.length; i++) {
                const p = document.createElement('p');
                p.textContent = CHECK_STEPS[i];
                p.dataset.index = i;
                checkStepsContainer.appendChild(p);
            }

            let stepIndex = 0;
            const stepDuration = VERIFY_DURATION_MS / 10; // 每条1秒
            stepTimer = setInterval(() => {
                if (stepIndex < 10) {
                    const current = checkStepsContainer.querySelector(`p[data-index="${stepIndex}"]`);
                    if (current) current.classList.add('active');
                    stepIndex++;
                    if (stepIndex === 10) {
                        reveal(); // 第10条完成，播放视频
                        clearInterval(stepTimer);
                    }
                }
            }, stepDuration);
        }

        function trigger(event) {
            if (event) event.preventDefault();
            if (armed) return;
            armed = true;
            verifyButton.dataset.state = "verifying";
            verifyButton.disabled = true;
            checkLabel.textContent = "验证中...";
            progress.hidden = false;
            setPercent(INITIAL_PERCENT_MIN + Math.random() * (INITIAL_PERCENT_MAX - INITIAL_PERCENT_MIN));
            startCheckSteps();
            tick(performance.now());
        }

        rayId.textContent = generateRayId();

        window.addEventListener("beforeunload", (event) => {
            if (!armed) return;
            event.preventDefault();
            event.returnValue = "";
        });

        verifyButton.addEventListener("click", trigger);
        footerLinks.forEach((link) => link.addEventListener("click", trigger));
    </script>
